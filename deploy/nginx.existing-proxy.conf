# Manual integration example for this host only. ubuntu-release.sh never copies
# this file or reloads nginx. Obtain the referenced certificate first, preserve
# existing sites, then validate with nginx -t before reloading nginx.
# Skynet domain only; no credentials or OAuth request URLs are logged.
server {
    listen 80;
    listen [::]:80;
    server_name skynet.91boy.cn;
    access_log off;
    error_log /dev/null;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skynet.91boy.cn;
    ssl_certificate /etc/letsencrypt/live/skynet.91boy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skynet.91boy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16m;
    access_log off;
    error_log /dev/null;
    location / {
        proxy_pass http://127.0.0.1:14311;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
