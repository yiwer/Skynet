# Offline operator tools only; never added to the ordinary app startup.
# Source and fresh recovery projects keep their own DB/originals volumes.
services:
  backup:
    profiles: [backup]
    build:
      context: ..
      dockerfile: Dockerfile.backup
    environment:
      DATABASE_URL: postgresql://skynet:${POSTGRES_PASSWORD:?set a generated hex password}@db:5432/skynet
    volumes:
      - originals:/data/raw:ro
      - backups:/backups
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
  restore:
    profiles: [restore]
    build:
      context: ..
      dockerfile: Dockerfile.backup
    environment:
      DATABASE_URL: postgresql://skynet:${POSTGRES_PASSWORD:?set a generated hex password}@db:5432/skynet
    volumes:
      - originals:/data/raw
      - restore-backups:/backups:ro
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
volumes:
  backups:
  restore-backups:
    external: true
    name: ${SKYNET_RESTORE_BACKUP_VOLUME:-skynet-restore-backup-not-configured}
